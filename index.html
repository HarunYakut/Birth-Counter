<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Birth Pulse — Mother & Child Care</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;600;700;800&family=Space+Mono:wght@400;700&display=swap');
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{--gold:#F5A623;--gold-bright:#FFD700;--gold-dim:#C48B1A;--cyan:#4FE0D9;--pink:#FF6B9D;--pink-hot:#FF2D78;--purple:#8B5CF6;--white-soft:#E8E6F0}
html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:'Outfit',sans-serif;color:var(--white-soft)}

#space-canvas{position:fixed;inset:0;z-index:0}
#globe-canvas{position:fixed;inset:0;z-index:1}

.overlay{position:fixed;inset:0;z-index:5;pointer-events:none;display:flex;align-items:center;padding:0 4.5vw;padding-bottom:8vh}
.data-panel{pointer-events:auto;max-width:480px}
.brand-tag{font-family:'Space Mono',monospace;font-size:clamp(.55rem,.75vw,.72rem);letter-spacing:.35em;text-transform:uppercase;color:var(--cyan);opacity:.55;margin-bottom:.8vh}
.main-title{font-size:clamp(1.6rem,3.2vw,3.2rem);font-weight:800;line-height:1.08;background:linear-gradient(135deg,var(--pink) 0%,var(--pink-hot) 40%,var(--purple) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.sub-title{font-size:clamp(.55rem,.78vw,.72rem);font-weight:300;letter-spacing:.15em;color:rgba(255,255,255,.3);margin-top:.5vh}
.counter-section{margin:3vh 0 1.2vh}
.counter-label{font-family:'Space Mono',monospace;font-size:clamp(.55rem,.78vw,.72rem);letter-spacing:.4em;text-transform:uppercase;color:var(--gold);opacity:.7;margin-bottom:.7vh}
.counter-value{font-family:'Outfit',sans-serif;font-size:clamp(3.2rem,7.5vw,7.5rem);font-weight:800;color:var(--gold-bright);line-height:1;text-shadow:0 0 40px rgba(255,215,0,.2),0 2px 4px rgba(0,0,0,.5);letter-spacing:-.02em}
.timeline-section{margin-top:.8vh}
.timeline-bar-container{position:relative;width:100%;max-width:420px;height:5px;background:rgba(255,255,255,.04);border-radius:2px}
.timeline-bar-fill{height:100%;border-radius:2px;background:linear-gradient(90deg,var(--gold-dim),var(--gold),var(--gold-bright));box-shadow:0 0 12px rgba(245,166,35,.3);transition:width 1s linear;position:relative}
.timeline-bar-fill::after{content:'';position:absolute;right:-5px;top:-5px;width:14px;height:14px;background:var(--gold-bright);border-radius:50%;box-shadow:0 0 10px var(--gold),0 0 22px rgba(255,215,0,.3)}
.timeline-labels{display:flex;justify-content:space-between;margin-top:.6vh;max-width:420px}
.timeline-labels span{font-family:'Space Mono',monospace;font-size:clamp(.45rem,.6vw,.55rem);color:rgba(255,255,255,.22)}
.current-time{font-family:'Space Mono',monospace;font-size:clamp(.9rem,1.3vw,1.2rem);color:var(--cyan);margin-top:1vh;opacity:.7;letter-spacing:.08em}
.stats-row{display:flex;gap:2.5vw;margin-top:2.5vh}
.stat-item{display:flex;flex-direction:column;gap:.3vh}
.stat-label{font-family:'Space Mono',monospace;font-size:clamp(.42rem,.56vw,.52rem);letter-spacing:.3em;text-transform:uppercase;color:rgba(255,255,255,.22)}
.stat-value{font-size:clamp(.95rem,1.5vw,1.35rem);font-weight:600;color:var(--white-soft)}
.stat-value .unit{font-size:.6em;font-weight:300;color:rgba(255,255,255,.3);margin-left:.15em}

/* Country label - BOTTOM LEFT */
.country-flash-label{position:fixed;bottom:12vh;left:4.5vw;z-index:10;font-family:'Space Mono',monospace;font-size:clamp(.55rem,.72vw,.68rem);letter-spacing:.2em;text-transform:uppercase;color:var(--pink);opacity:0;transition:opacity .3s;display:flex;align-items:center;gap:.5em;pointer-events:none}
.country-flash-label .dot{width:6px;height:6px;background:var(--pink-hot);border-radius:50%;box-shadow:0 0 8px var(--pink-hot)}

/* Philips branding - upper left with heartbeat glow */
.philips-branding{position:fixed;top:2.5vh;left:4.5vw;z-index:10;pointer-events:auto}
.philips-shield{height:clamp(45px,5vw,65px);animation:heartbeatGlow 3.5s ease-in-out infinite}
@keyframes heartbeatGlow{
  0%{filter:drop-shadow(0 0 4px rgba(100,160,255,.15)) brightness(0.82)}
  8%{filter:drop-shadow(0 0 18px rgba(100,170,255,.65)) brightness(1.12)}
  14%{filter:drop-shadow(0 0 5px rgba(100,160,255,.2)) brightness(0.87)}
  20%{filter:drop-shadow(0 0 13px rgba(100,170,255,.5)) brightness(1.06)}
  30%{filter:drop-shadow(0 0 4px rgba(100,160,255,.12)) brightness(0.82)}
  100%{filter:drop-shadow(0 0 4px rgba(100,160,255,.15)) brightness(0.82)}
}




/* Color scheme context menu */
.color-menu{position:fixed;z-index:200;background:rgba(10,12,25,0.95);border:1px solid rgba(255,255,255,0.1);border-radius:12px;padding:12px 0;min-width:200px;max-height:70vh;overflow-y:auto;backdrop-filter:blur(12px);display:none;box-shadow:0 8px 32px rgba(0,0,0,.6)}
.color-menu.visible{display:block}
.color-separator{height:1px;background:rgba(255,255,255,.06);margin:6px 0}
.color-toggle{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;cursor:pointer;font-family:'Outfit',sans-serif;font-size:13px;color:rgba(255,255,255,.8);transition:background .15s}
.color-toggle:hover{background:rgba(255,255,255,.06)}
.toggle-switch{width:36px;height:20px;background:rgba(255,255,255,.12);border-radius:10px;position:relative;transition:background .2s}
.toggle-switch.on{background:var(--cyan)}
.toggle-switch::after{content:'';position:absolute;top:2px;left:2px;width:16px;height:16px;background:white;border-radius:50%;transition:transform .2s}
.toggle-switch.on::after{transform:translateX(16px)}
.speed-control{padding:8px 16px 12px}
.speed-label{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:rgba(255,255,255,.3);display:block;margin-bottom:6px}
.speed-slider-row{display:flex;align-items:center;gap:10px}
.speed-val{font-family:'Space Mono',monospace;font-size:12px;color:var(--cyan);min-width:36px}
.speed-slider{flex:1;-webkit-appearance:none;appearance:none;height:4px;background:rgba(255,255,255,.1);border-radius:2px;outline:none}
.speed-slider::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;background:var(--cyan);border-radius:50%;cursor:pointer;box-shadow:0 0 6px rgba(79,224,217,.4)}
.speed-slider::-moz-range-thumb{width:14px;height:14px;background:var(--cyan);border-radius:50%;cursor:pointer;border:none;box-shadow:0 0 6px rgba(79,224,217,.4)}
.color-menu-title{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.25em;text-transform:uppercase;color:rgba(255,255,255,.3);padding:4px 16px 10px;border-bottom:1px solid rgba(255,255,255,.06)}
.color-option{display:flex;align-items:center;gap:12px;padding:10px 16px;cursor:pointer;transition:background .15s;font-family:'Outfit',sans-serif;font-size:13px;color:rgba(255,255,255,.8)}
.color-option:hover{background:rgba(255,255,255,.06)}
.color-option.current{color:var(--cyan)}
.color-option.current::after{content:'✓';margin-left:auto;color:var(--cyan);font-size:14px}
.color-swatch{display:flex;gap:3px}
.color-swatch span{width:14px;height:14px;border-radius:3px;border:1px solid rgba(255,255,255,.1)}

.loading-screen{position:fixed;inset:0;z-index:100;background:#000;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:2vh;transition:opacity 1s,visibility 1s}
.loading-screen.hidden{opacity:0;visibility:hidden}
.loading-text{font-family:'Space Mono',monospace;font-size:clamp(.5rem,.65vw,.6rem);letter-spacing:.5em;text-transform:uppercase;color:var(--cyan);opacity:.5;animation:lp 2s ease-in-out infinite}
@keyframes lp{0%,100%{opacity:.3}50%{opacity:.7}}
.loading-bar{width:160px;height:2px;background:rgba(255,255,255,.06);border-radius:1px;overflow:hidden}
.loading-bar-inner{width:0%;height:100%;background:linear-gradient(90deg,var(--cyan),var(--pink));border-radius:1px;transition:width .3s}
</style>
</head>
<body>
<div class="loading-screen" id="loadingScreen">
  <div class="loading-text">Loading World Data</div>
  <div class="loading-bar"><div class="loading-bar-inner" id="loadingBar"></div></div>
</div>

<canvas id="space-canvas"></canvas>
<canvas id="globe-canvas"></canvas>

<!-- Country label - BOTTOM LEFT -->
<div class="country-flash-label" id="countryLabel"><span class="dot"></span><span id="countryName"></span></div>

<div class="overlay">
  <div class="data-panel">
    <div class="brand-tag">Philips · Mother & Child Care</div>
    <h1 class="main-title">Women's Health<br>Birth Pulse</h1>
    <div class="sub-title">Real-time global birth monitoring · WHO Data</div>
    <div class="counter-section">
      <div class="counter-label">Global Births Today</div>
      <div class="counter-value" id="birthCounter">0</div>
    </div>
    <div class="timeline-section">
      <div class="timeline-bar-container"><div class="timeline-bar-fill" id="timelineFill" style="width:0%"></div></div>
      <div class="timeline-labels"><span>00:00 UTC</span><span>24:00 UTC</span></div>
      <div class="current-time" id="currentTime">00:00:00</div>
    </div>
    <div class="stats-row">
      <div class="stat-item"><div class="stat-label">Births / Minute</div><div class="stat-value">267<span class="unit">/min</span></div></div>
      <div class="stat-item"><div class="stat-label">Births / Second</div><div class="stat-value">4.5<span class="unit">/sec</span></div></div>
      <div class="stat-item"><div class="stat-label">Top Region</div><div class="stat-value">South Asia</div></div>
    </div>
  </div>
</div>

// Right-click to open menu

  e.preventDefault();
  colorMenu.style.left = Math.min(e.clientX, window.innerWidth - 220) + 'px';
  colorMenu.style.top = Math.min(e.clientY, window.innerHeight - 400) + 'px';

});

function applyColorScheme(name) {
  currentScheme = name;
  // Update menu checkmarks
  document.querySelectorAll('.color-option').forEach(el => {
    el.classList.toggle('current', el.dataset.scheme === name);
  });
  colorMenu.classList.remove('visible');
  // Redraw countries with new colors
  if (countryFeatures.length > 0) drawAllCountries();
}


// Auto-rotate color scheme
let autoRotateEnabled = false;
let autoRotateTimer = null;

document.getElementById('autoRotateToggle').addEventListener('click', () => {
  autoRotateEnabled = !autoRotateEnabled;
  document.getElementById('autoRotateSwitch').classList.toggle('on', autoRotateEnabled);
  if (autoRotateEnabled) {
    startAutoRotate();
  } else {
    clearInterval(autoRotateTimer);
    autoRotateTimer = null;
  }
});

function startAutoRotate() {
  if (autoRotateTimer) clearInterval(autoRotateTimer);
  const schemeNames = Object.keys(COLOR_SCHEMES);
  autoRotateTimer = setInterval(() => {
    if (!autoRotateEnabled) return;
    let idx = schemeNames.indexOf(currentScheme);
    idx = (idx + 1) % schemeNames.length;
    applyColorScheme(schemeNames[idx]);
  }, 5 * 60 * 1000); // 5 minutes
}

const spaceMat = new THREE.ShaderMaterial({
  uniforms: {
    uResolution: { value: new THREE.Vector2(window.innerWidth * window.devicePixelRatio, window.innerHeight * window.devicePixelRatio) },
    uTime: { value: 0.0 },

  vertexShader: `void main(){ gl_Position = vec4(position,1.0); }`,
  fragmentShader: `
    precision highp float;

    uniform float uTime;

    float noise(vec2 p){
      vec2 i = floor(p), f = fract(p);

    float fbm(vec2 p){

    }

    float starField(vec2 uv, float threshold, float sizeVar){
      vec2 gs=vec2(250.0)*sizeVar, cell=floor(uv*gs), cuv=fract(uv*gs);
      float h=hash(cell),h2=hash(cell+99.0);
      vec2 sp=vec2(0.2+h*0.6,0.2+h2*0.6);
      float d=length(cuv-sp);
      float present=step(threshold,hash(cell+42.0));
      float twinkle=0.7+0.3*sin(uTime*(0.3+h*1.5)+h2*6.283);
      float bright=hash(cell+7.0); bright*=bright;
      float star=smoothstep(0.06,0.0,d)*bright*twinkle;

    }

    vec3 starColor(vec2 uv, float sv){
      vec2 cell=floor(uv*vec2(250.0)*sv);
      float t=hash(cell+200.0);
      if(t<0.2) return vec3(0.65,0.75,1.0);
      if(t<0.45) return vec3(0.85,0.88,1.0);
      if(t<0.7) return vec3(1.0,0.98,0.95);
      if(t<0.85) return vec3(1.0,0.92,0.75);

    // Realistic planet rendering
    vec3 renderPlanet(vec2 uv, vec2 pos, float r, vec3 baseCol, vec3 darkCol, float surfaceDetail, float surfaceSeed, float lightAngle){
      float d = length(uv - pos);
      if(d > r * 4.0) return vec3(0.0); // early out for glow range
      vec3 result = vec3(0.0);
      // Atmospheric glow
      float glow = exp(-d / (r * 2.5)) * 0.06;
      result += mix(baseCol, vec3(0.5,0.6,0.8), 0.3) * glow;
      if(d > r) return result;

      vec2 local = (uv - pos) / r; // -1 to 1
      float z = sqrt(max(0.0, 1.0 - dot(local, local))); // sphere z
      vec3 normal = vec3(local, z);

      float diff = max(dot(normal, lightDir), 0.0);

      float surf2 = fbm(sphereUV * surfaceDetail * 2.3 + surfaceSeed * 20.0 + 50.0);

      surfCol = mix(surfCol, surfCol * 0.7, surf2 * 0.3);

    vec3 renderRingedPlanet(vec2 uv, vec2 pos, float r, vec3 baseCol, vec3 darkCol, float surfDetail, float seed, float lightAng, vec3 ringCol){

        float cOn = step(cStart, loopProg) * step(loopProg, cEnd);

            nucCol=vec3(1.0,0.95,0.8);coreCol=vec3(0.95,0.82,0.55);tailCol=vec3(0.65,0.5,0.3);

          } else if(colorType==2){ // Emerald (Hartley)
            nucCol=vec3(0.9,1.0,0.9);coreCol=vec3(0.15,0.85,0.25);tailCol=vec3(0.08,0.4,0.12);

          } else if(colorType==3){ // Blue-white (Great Comet)
            nucCol=vec3(1.0,1.0,1.0);coreCol=vec3(0.7,0.78,0.95);tailCol=vec3(0.3,0.4,0.6);

          } else { // Warm amber (Comet West)
            nucCol=vec3(1.0,0.88,0.65);coreCol=vec3(0.95,0.65,0.3);tailCol=vec3(0.55,0.3,0.1);

            col += nucCol * exp(-hd*hd/(nucR*nucR*0.4)) * 2.0 * fade;

            col += coreCol * exp(-hd*hd/(nucR*nucR*1.5)) * 2.0 * fade;
            col += glowCol * exp(-hd*hd/(nucR*nucR*8.0)) * 0.6 * fade;

const MOON_R = GLOBE_R * 0.075; // realistically small

const moonMat = new THREE.ShaderMaterial({
  uniforms: {
    uLightDir: { value: new THREE.Vector3(-0.6, 0.4, 0.7).normalize() }
  },
  vertexShader: `
    varying vec3 vNormal;
    varying vec3 vPosition;
    varying vec2 vUv;
    void main(){
      vNormal = normalize(normalMatrix * normal);
      vPosition = (modelViewMatrix * vec4(position,1.0)).xyz;
      vUv = uv;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0);
    }
  `,
  fragmentShader: `
    precision highp float;
    varying vec3 vNormal;
    varying vec3 vPosition;
    varying vec2 vUv;
    uniform vec3 uLightDir;
    
    float hash2(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7))) * 43758.5453); }
    float noise2(vec2 p){
      vec2 i=floor(p),f=fract(p); f=f*f*(3.0-2.0*f);
      return mix(mix(hash2(i),hash2(i+vec2(1,0)),f.x),mix(hash2(i+vec2(0,1)),hash2(i+vec2(1,1)),f.x),f.y);
    }
    float fbm2(vec2 p){
      float v=0.0,a=0.5; mat2 r=mat2(0.8,0.6,-0.6,0.8);
      for(int i=0;i<6;i++){v+=a*noise2(p);p=r*p*2.0;a*=0.5;} return v;
    }
    
    void main(){
      vec3 n = normalize(vNormal);
      float diff = max(dot(n, uLightDir), 0.0);
      float terminator = smoothstep(-0.01, 0.08, diff);
      
      // Spherical coords for consistent surface features
      float theta = acos(clamp(vUv.y * 2.0 - 1.0, -1.0, 1.0));
      float phi = vUv.x * 6.2832;
      vec2 sp = vec2(phi, theta) * 1.5;
      
      // Lunar highlands base texture
      float highlands = fbm2(sp * 3.0 + 10.0);
      
      // Maria (dark seas) - larger smooth features
      float maria = fbm2(sp * 0.8 + 30.0);
      float mariaMap = smoothstep(0.42, 0.58, maria);
      
      // Multi-scale craters for realism
      float craterBump = 0.0;
      // Large craters
      for(int i=0; i<4; i++){
        float scale = 8.0 + float(i) * 12.0;
        vec2 cp = floor(sp * scale);
        vec2 cf = fract(sp * scale);
        float ch = hash2(cp + float(i)*77.0);
        if(ch > 0.65){
          vec2 cen = vec2(0.25+ch*0.5, 0.25+hash2(cp+33.0)*0.5);
          float cd = length(cf - cen);
          float cr = 0.06 + ch * 0.12;
          // Rim highlight + shadow inside
          float rim = smoothstep(cr, cr*0.85, cd) * (1.0 - smoothstep(cr*0.82, cr*0.5, cd)*0.8);
          // Central peak for larger craters
          float peak = (i < 2) ? exp(-cd*cd/(cr*cr*0.02)) * 0.3 : 0.0;
          craterBump += (rim + peak) * 0.12;
        }
      }
      // Small craters (micro-texture)
      for(int i=0; i<3; i++){
        float scale = 40.0 + float(i) * 30.0;
        vec2 cp = floor(sp * scale);
        vec2 cf = fract(sp * scale);
        float ch = hash2(cp + float(i)*200.0 + 500.0);
        if(ch > 0.6){
          vec2 cen = vec2(0.3+ch*0.4, 0.3+hash2(cp+150.0)*0.4);
          float cd = length(cf - cen);
          float cr = 0.05 + ch*0.1;
          craterBump += smoothstep(cr,cr*0.7,cd) * 0.04;
        }
      }
      
      // Surface color
      vec3 highlandCol = vec3(0.68, 0.66, 0.63) + highlands * 0.06;
      vec3 mariaCol = vec3(0.32, 0.31, 0.29) + highlands * 0.04;
      vec3 surfaceCol = mix(highlandCol, mariaCol, mariaMap);
      surfaceCol += craterBump;
      
      // Micro-roughness
      float rough = fbm2(sp * 25.0 + 200.0);
      surfaceCol *= 0.92 + rough * 0.16;
      
      // Regolith color variation (subtle warm/cool patches)
      float regolith = fbm2(sp * 2.0 + 500.0);
      surfaceCol *= mix(vec3(1.0, 0.98, 0.95), vec3(0.95, 0.97, 1.0), regolith);
      
      // Lighting with soft terminator
      float ambient = 0.03;
      vec3 color = surfaceCol * (ambient + (1.0-ambient) * diff * terminator);
      
      // Limb darkening (Oren-Nayar approximation feel)
      float viewDot = max(dot(n, normalize(-vPosition)), 0.0);
      float limb = pow(viewDot, 0.4);
      color *= 0.7 + 0.3 * limb;
      
      // Earthshine on dark side - subtle blue tint
      color += vec3(0.02, 0.025, 0.04) * surfaceCol * (1.0 - terminator);
      
      gl_FragColor = vec4(color, 1.0);
    }
  `
});

// GeoJSON
let countryFeatures = [], countryPathMap = {};

function lonLatToTex(lon, lat) { return [((lon+180)/360)*TEX_W, ((90-lat)/180)*TEX_H]; }

function drawRing(ctx, coords, fill, stroke, lw) {
  if (!coords || coords.length < 3) return;
  let minL=Infinity, maxL=-Infinity;
  for (const c of coords) { if(c[0]<minL) minL=c[0]; if(c[0]>maxL) maxL=c[0]; }
  const crosses = (maxL-minL) > 180;
  ctx.beginPath();
  for (let i=0; i<coords.length; i++) {
    let lon=coords[i][0], lat=coords[i][1];
    if (crosses && lon<0) lon+=360;
    const [x,y] = lonLatToTex(crosses?lon:coords[i][0], lat);
    i===0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
  }
  ctx.closePath();
  if (fill) { ctx.fillStyle=fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle=stroke; ctx.lineWidth=lw||1; ctx.stroke(); }
}

function drawGeom(ctx, geom, fill, stroke, lw) {
  if (geom.type==='Polygon') { if(geom.coordinates[0]) drawRing(ctx, geom.coordinates[0], fill, stroke, lw); }
  else if (geom.type==='MultiPolygon') { for(const p of geom.coordinates) { if(p[0]) drawRing(ctx, p[0], fill, stroke, lw); } }
}

function drawAllCountries() {
  const scheme = COLOR_SCHEMES[currentScheme];
  tCtx.clearRect(0,0,TEX_W,TEX_H);
  for (const f of countryFeatures) drawGeom(tCtx, f.geometry, scheme.land, scheme.border, 1.2);
  globeTexture.needsUpdate = true;
}

const activeHighlights = {};
let hlDirty = false;

function highlightCountry(iso) {
  if (!iso || !countryPathMap[iso]) return;
  activeHighlights[iso] = { startTime: performance.now() };
  hlDirty = true;
}

function updateHighlights() {
  const now = performance.now(), dur = 1800;
  let any = false;
  hCtx.clearRect(0,0,TEX_W,TEX_H);
  const hl = COLOR_SCHEMES[currentScheme].highlight;
  for (const [iso, d] of Object.entries(activeHighlights)) {
    const e = now - d.startTime;
    if (e > dur) { delete activeHighlights[iso]; continue; }
    any = true;
    const t = e/dur;
    const a = t<0.1 ? (t/0.1)*0.65 : 0.65*(1-((t-0.1)/0.9));
    const geoms = countryPathMap[iso]; if(!geoms) continue;
    for (const g of geoms) drawGeom(hCtx, g, `rgba(${hl[0]},${hl[1]},${hl[2]},${a})`, null, 0);
  }
  if (any || hlDirty) { hlTexture.needsUpdate=true; hlDirty=false; }
}

async function loadWorldData() {
  document.getElementById('loadingBar').style.width = '15%';
  try {
    const resp = await fetch('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-50m.json');
    document.getElementById('loadingBar').style.width = '50%';
    const topo = await resp.json();
    document.getElementById('loadingBar').style.width = '75%';
    countryFeatures = topojson.feature(topo, topo.objects.countries).features.filter(f => String(f.id)!=='10');
    for (const f of countryFeatures) {
      const iso = NUM_TO_ISO[String(f.id)]||'UNK';
      f.properties.ADM0_A3 = iso;
      if (!countryPathMap[iso]) countryPathMap[iso]=[];
      countryPathMap[iso].push(f.geometry);
    }
    document.getElementById('loadingBar').style.width = '85%';
    drawAllCountries();
    document.getElementById('loadingBar').style.width = '100%';
    setTimeout(() => { document.getElementById('loadingScreen').classList.add('hidden'); startApp(); }, 300);
  } catch(e) {
    console.error(e);
    setTimeout(() => { document.getElementById('loadingScreen').classList.add('hidden'); startApp(); }, 300);
  }
}

let displayedBirths = 0;
function updateUI() {
  const now=new Date(), start=new Date(now); start.setUTCHours(0,0,0,0);
  const current = Math.floor(((now-start)/1000)*BIRTHS_PER_SECOND);
  const diff = current-displayedBirths;
  if(diff>0){ displayedBirths+=Math.max(1,Math.floor(diff*0.08)); if(displayedBirths>current) displayedBirths=current; }
  document.getElementById('birthCounter').textContent = displayedBirths.toLocaleString('en-US');
  document.getElementById('timelineFill').style.width = ((now-start)/86400000*100)+'%';
  document.getElementById('currentTime').textContent =
    `${String(now.getUTCHours()).padStart(2,'0')}:${String(now.getUTCMinutes()).padStart(2,'0')}:${String(now.getUTCSeconds()).padStart(2,'0')} UTC`;
}

function triggerBirth() {
  let r=Math.random(), c=BIRTH_DATA[0];
  for(const b of BIRTH_DATA){ r-=b.w; if(r<=0){c=b;break;} }
  highlightCountry(c.iso);
  const lbl=document.getElementById('countryLabel');
  document.getElementById('countryName').textContent=c.name;
  lbl.style.opacity='1'; clearTimeout(lbl._t);
  lbl._t=setTimeout(()=>lbl.style.opacity='0',1500);
}
function scheduleBirths(){ triggerBirth(); setTimeout(scheduleBirths, 120+Math.random()*200); }



let spacePan = 0.0;
const PAN_CYCLE = 2.0; // content repeats every 2.0 units

function animate(time) {
  requestAnimationFrame(animate);
  const t = time * 0.001;
  
  // Continuous pan
  spacePan += rotationSpeed * 0.55;
  spaceMat.uniforms.uTime.value = t;
  spaceMat.uniforms.uPan.value = spacePan;
  spaceRenderer.render(spaceScene, spaceCam);
  
  globeGroup.rotation.y += rotationSpeed;
  
  // Moon orbit: counter Earth spin + add moon's own orbit rate
  // This keeps the moon orbiting at its own speed independent of Earth rotation
  moonPivot.rotation.y -= rotationSpeed; // cancel Earth spin
  moonPivot.rotation.y += MOON_ORBIT_SPEED / 60; // add moon orbit
  // Tidally locked rotation
  moonMesh.rotation.y = -moonPivot.rotation.y;
  
  updateHighlights();
  updateUI();
  renderer.render(scene, camera);
}

function startApp(){ animate(0); scheduleBirths(); }

window.addEventListener('resize', () => {
  const w=window.innerWidth, h=window.innerHeight;
  camera.aspect=w/h; camera.updateProjectionMatrix();
  renderer.setSize(w,h);
  spaceRenderer.setSize(w,h);
  spaceMat.uniforms.uResolution.value.set(w*window.devicePixelRatio, h*window.devicePixelRatio);
});

window.addEventListener('load', loadWorldData);
